[package]
name = "opentake-desktop"
version = "0.1.0-alpha.1"
description = "OpenTake Tauri 2 Desktop Shell"
authors = ["OpenTake Contributors"]
license = "GPL-3.0-or-later"
edition = "2021"

[lib]
name = "opentake_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
opentake-core = { path = "../crates/opentake-core" }
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tokio = { version = "1.43", features = ["rt-multi-thread", "macros"] }
