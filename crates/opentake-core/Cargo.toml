[package]
name = "opentake-core"
version = "0.1.0-alpha.1"
edition = "2021"
authors = ["OpenTake Contributors"]
description = "Pure headless domain engine for OpenTake video editor"
license = "GPL-3.0-or-later"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.15", features = ["v4", "serde"] }

