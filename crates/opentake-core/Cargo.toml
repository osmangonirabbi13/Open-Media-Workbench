[package]
name = "opentake-core"
version = "0.1.0-alpha.1"
edition = "2021"
authors = ["OpenTake Contributors"]
description = "Pure headless domain engine for OpenTake video editor"
license = "GPL-3.0-or-later"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.15", features = ["v4", "serde"] }
tokio = { version = "1.43", features = ["process", "sync", "time", "macros", "io-util", "rt"] }
tokio-util = "0.7"
libc = "0.2"
sha2 = "0.10"

[dev-dependencies]
tokio = { version = "1.43", features = ["rt-multi-thread", "macros"] }
tempfile = "3"

